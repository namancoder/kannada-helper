name: kannada_helper
description: Personal offline app to understand and speak basic Kannada.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # On-device translation (v1 engine). Free, offline after model download.
  google_mlkit_translation: ^0.15.1
  # Android system text-to-speech, used for Kannada audio.
  flutter_tts: ^4.2.5
  # Phone's built-in speech recognizer, used for Speak mode.
  speech_to_text: ^7.5.0
  # Camera preview + frames for Scan mode (needs Android minSdk 24).
  camera: ^0.12.1
  # Pure-Dart image crop/encode for the scan box.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
